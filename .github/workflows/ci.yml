name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: uv sync --locked --extra private --no-python-downloads
      - run: ./scripts/verify.sh lint-format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: uv sync --locked --extra private --no-python-downloads
      - run: ./scripts/verify.sh typecheck

  tests-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: uv sync --locked --extra private --no-python-downloads
      - run: uv pip install --python .venv/bin/python -r src/jarvis_office/echo/requirements.txt
      - run: ./scripts/verify.sh tests-python

  tests-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/verify.sh tests-javascript

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: uv sync --locked --extra private --no-python-downloads
      - run: ./scripts/verify.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: office-wheel
          path: dist/*.whl

  diagnostics:
    if: always()
    needs:
      - lint-format
      - typecheck
      - tests-python
      - tests-javascript
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent job to succeed
        env:
          LINT: ${{ needs.lint-format.result }}
          TYPES: ${{ needs.typecheck.result }}
          PY: ${{ needs.tests-python.result }}
          JS: ${{ needs.tests-javascript.result }}
          PKG: ${{ needs.package.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          results = {
              "lint-format": os.environ["LINT"],
              "typecheck": os.environ["TYPES"],
              "tests-python": os.environ["PY"],
              "tests-javascript": os.environ["JS"],
              "package": os.environ["PKG"],
          }
          for name, result in results.items():
              print(f"{name}: {result}")
          failed = [name for name, result in results.items() if result != "success"]
          if failed:
              print("required jobs not successful: " + ", ".join(failed))
              sys.exit(1)
          PY
