<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Jarvis Office</title>
<style nonce="NONCE">body{font:18px system-ui;
max-width:850px;
margin:3rem auto;
padding:1rem;
background:#111820;
color:#edf5ff}
button{font:inherit;
margin:.3rem;
padding:.6rem}pre{white-space:pre-wrap;
overflow-wrap:anywhere}small{color:#b8cadc}</style>
<h1>Jarvis Office</h1>
<p id="notice">
</p>
<p>
<strong id="state">Connexion locale…</strong>
</p>
<p id="qualification">
</p>
<p id="devices">
</p>
<label>Niveau micro <meter id="level" min="0" max="1" value="0">
</meter>
</label>
<p>
<button data-action="resume">Reprendre (essai borné)</button>
<button data-action="pause">Pause</button>
<button data-action="cancel">Annuler</button>
<button data-action="clear">Effacer la session</button>
<button data-action="stop">Arrêter</button>
</p>
<h2>Dernière demande adressée</h2>
<pre id="transcription">
</pre>
<h2>Réponse</h2>
<pre id="response">
</pre>
<p id="playback">
</p>
<p id="error" role="alert">
</p>
<details>
<summary>Mesures (pas de preuve acoustique)</summary>
<pre id="metrics">
</pre>
</details>
<script nonce="NONCE">
const headers={'Content-Type':'application/json','X-Jarvis-Local':'1'};

async function api(path,data={}){const r=await fetch(path,{method:'POST',headers,credentials:'same-origin',body:JSON.stringify(data)});
if(!r.ok)throw Error('Contrôle local indisponible');
return r.json()}
for(const b of document.querySelectorAll('button'))b.onclick=async()=>{try{await api('/control',{action:b.dataset.action})}catch(e){document.getElementById('error').textContent=e.message}};

async function poll(){try{const s=await api('/snapshot');
for(const k of ['state','notice','qualification','transcription','response','playback','error'])document.getElementById(k).textContent=s[k]||'';

document.getElementById('devices').textContent=JSON.stringify({micro:s.microphone,selection:{input:s.selected_input,output:s.selected_output},verification:{input:s.input,output:s.output}});

document.getElementById('metrics').textContent=JSON.stringify(s.metrics,null,2);
document.getElementById('level').value=s.level||0;

}catch(e){document.getElementById('state').textContent='Contrôleur arrêté ou connexion perdue'}setTimeout(poll,300)}
api('/bootstrap').then(poll).catch(()=>{document.getElementById('state').textContent='Amorçage local refusé'});

</script>
</html>
