<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dumont">
<title>Jarvis Dumont</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<style nonce="NONCE">
:root{
  --bg:#070b12;--text:#e8f4ff;--muted:#9ab0c4;--line:#2a4156;--surface:#101820;
  --cyan:#7dd3fc;--danger:#fb7185;
  --pad-l:max(16px,env(safe-area-inset-left));
  --pad-r:max(16px,env(safe-area-inset-right));
  color-scheme:dark;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{
  min-height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad-r) calc(12px + env(safe-area-inset-bottom)) var(--pad-l);
  background:
    radial-gradient(1200px 500px at 50% -10%,rgba(125,211,252,.12),transparent 55%),
    radial-gradient(2px 2px at 12% 18%,#c7e8ff 0 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 22%,#fff 0 50%,transparent 51%),
    radial-gradient(1px 1px at 30% 72%,#9ad5ff 0 50%,transparent 51%),
    var(--bg);
}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.callsign small,.telem time,#devices{display:block;font:12px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.callsign h1{margin:4px 0 0;font-size:22px;letter-spacing:.06em}
.telem{text-align:right}
#chip{margin-top:6px;display:inline-block;border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font:14px/1.1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--muted)}
#chip.hot{color:#042f2e;background:var(--cyan);border-color:var(--cyan)}
#chip.fault{color:#2a0a10;background:var(--danger);border-color:var(--danger)}
.visor{display:flex;flex-direction:column;align-items:center;padding:4px 0}
.orb{--level:0;appearance:none;border:0;background:transparent;color:inherit;width:min(42vw,148px);
  aspect-ratio:1;border-radius:50%;position:relative;padding:0;touch-action:manipulation}
.ring,.core{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ring{background:conic-gradient(from -90deg,var(--cyan) calc(var(--level)*1%),#163044 0);
  mask:radial-gradient(circle,transparent 58%,#000 60%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%)}
.core{inset:18%;background:radial-gradient(circle at 45% 35%,#d9f4ff,#0b3a4e 55%,#061018 78%);
  box-shadow:inset 0 0 0 1px rgba(125,211,252,.35),0 0 24px rgba(125,211,252,.16)}
.orb.hot .core{box-shadow:inset 0 0 0 1px rgba(125,211,252,.75),0 0 28px rgba(125,211,252,.4)}
.orb-label{position:absolute;inset:auto 8% 16%;text-align:center;font:13px/1.1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#notice{min-height:2.4em;margin:10px 8px 0;text-align:center;color:var(--muted);font-size:14px}
.log{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:120px;
  margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.log p{margin:0;max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.log .user{align-self:flex-end;background:#1d4ed8}
.log .assistant{align-self:flex-start;background:#182230;border:1px solid var(--line)}
#empty{margin:auto;color:var(--muted);text-align:center;max-width:100%}
#error{min-height:1.2em;margin:0 0 8px;color:var(--danger);font-size:14px}
.dock{display:flex;flex-direction:column;gap:12px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.key,form button{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  color:var(--text);font:13px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:manipulation}
.key.danger{color:var(--danger);border-color:#7f1d1d}
.orb:active,.key:active,form button:active{transform:scale(.97);transition:transform 120ms ease-out}
#composer{display:none;gap:8px}
#composer.open{display:flex}
#text{flex:1;min-height:52px;border:1px solid var(--line);border-radius:14px;background:#0c1218;
  color:var(--text);padding:0 12px;font:16px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
form button{padding:0 14px;background:var(--cyan);color:#042f2e;border-color:var(--cyan)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.orb:active,.key:active,form button:active{transform:none}}
@media (prefers-reduced-transparency:reduce), (prefers-contrast:more){
  .log,.key,#text,form button{background:#0a1016}
  .log .user{background:#1e3a8a}
}
</style>
<header class="hud">
  <div class="callsign"><small>Combinaison · Dumont</small><h1>JARVIS</h1><span id="devices">Conversation locale</span></div>
  <div class="telem"><time id="clock">--:--</time><div id="chip" role="status">Liaison…</div></div>
</header>
<main>
  <section class="visor">
    <button type="button" id="listen" class="orb" aria-pressed="false" aria-label="Écouter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="ring" id="ring"></span><span class="core"></span>
      <span class="orb-label" id="orb-label">Écouter</span>
    </button>
    <meter id="level" class="sr" min="0" max="1" value="0">Niveau micro</meter>
    <p id="notice" role="status"></p>
  </section>
  <section id="log" class="log">
    <p id="empty">Canal ouvert. Appuyez sur l’orbe pour parler.</p>
  </section>
  <p id="error" role="alert"></p>
</main>
<footer class="dock">
  <button type="button" class="sr" data-action="resume">Écouter</button>
  <button type="button" class="sr" data-action="pause">Pause</button>
  <div class="keys">
    <button type="button" class="key" data-action="cancel">Couper</button>
    <button type="button" class="key" id="tx-toggle" aria-expanded="false" aria-controls="composer" aria-label="Écrire un message">Écrire</button>
  </div>
  <button type="button" class="key danger" data-action="clear">Effacer la session</button>
  <form id="composer">
    <label class="sr" for="text">Message à Jarvis</label>
    <input id="text" maxlength="2000" autocomplete="off" enterkeyhint="send" placeholder="Message…">
    <button type="submit">Envoyer</button>
  </form>
</footer>
<script nonce="NONCE">
const headers={'Content-Type':'application/json','X-Jarvis-Local':'1'};
const labels={paused:'Pause',listening:'Écoute',transcribing:'Lecture',responding:'Réponse',starting:'Démarrage',error:'Erreur',stopping:'Arrêt'};
const log=document.getElementById('log');
const listen=document.getElementById('listen');
const chip=document.getElementById('chip');
const composer=document.getElementById('composer');
let lastUser='', lastAnswer='', armed=false;
function tick(){
  const n=new Date();
  const p=v=>String(v).padStart(2,'0');
  const clock=document.getElementById('clock');
  clock.dateTime=n.toISOString();
  clock.textContent=p(n.getHours())+':'+p(n.getMinutes());
}
function append(role,text){
  const empty=document.getElementById('empty');
  if(empty)empty.remove();
  const p=document.createElement('p');
  p.className=role;
  p.textContent=text;
  log.appendChild(p);
  log.scrollTop=log.scrollHeight;
}
async function api(path,data={}){
  const r=await fetch(path,{method:'POST',headers,credentials:'same-origin',body:JSON.stringify(data)});
  if(!r.ok)throw Error('Liaison locale coupée');
  return r.json();
}
listen.onclick=async()=>{
  try{await api('/control',{action:armed?'pause':'resume'})}
  catch(e){document.getElementById('error').textContent=e.message}
};
for(const b of document.querySelectorAll('[data-action]')){
  b.onclick=async()=>{
    if(b.dataset.action==='clear' && !window.confirm('Effacer la session ?'))return;
    try{await api('/control',{action:b.dataset.action})}
    catch(e){document.getElementById('error').textContent=e.message}
  };
}
document.getElementById('tx-toggle').onclick=()=>{
  const open=composer.classList.toggle('open');
  document.getElementById('tx-toggle').setAttribute('aria-expanded',String(open));
};
document.getElementById('composer').onsubmit=async(e)=>{
  e.preventDefault();
  const box=document.getElementById('text');
  const text=box.value.trim();
  if(!text)return;
  try{await api('/say',{text});box.value=''}
  catch(err){document.getElementById('error').textContent=err.message}
};
async function poll(){
  try{
    const s=await api('/snapshot');
    armed=s.armed===true;
    chip.textContent=labels[s.state]||s.state||'';
    chip.classList.toggle('hot',armed);
    chip.classList.toggle('fault',s.state==='error'||Boolean(s.error));
    listen.classList.toggle('hot',armed);
    listen.setAttribute('aria-pressed',String(armed));
    listen.setAttribute('aria-label',armed?'Couper l’écoute':'Écouter');
    document.getElementById('orb-label').textContent=armed?'En ligne':'Écouter';
    const level=Math.max(0,Math.min(1,Number(s.level)||0));
    listen.style.setProperty('--level',String(Math.round(level*100)));
    listen.setAttribute('aria-valuenow',String(Math.round(level*100)));
    document.getElementById('level').value=level;
    document.getElementById('notice').textContent=s.notice||'';
    document.getElementById('error').textContent=s.error||'';
    document.getElementById('devices').textContent=[s.selected_input,s.selected_output].filter(Boolean).join(' · ')||'Conversation locale';
    if(s.transcription&&s.transcription!==lastUser){append('user',s.transcription);lastUser=s.transcription}
    if(s.response&&s.response!==lastAnswer){append('assistant',s.response);lastAnswer=s.response}
  }catch(e){
    chip.textContent='Coupé';
    chip.classList.add('fault');
  }
  setTimeout(poll,300);
}
tick();
setInterval(tick,30000);
api('/bootstrap').then(poll).catch(()=>{chip.textContent='Hors ligne';chip.classList.add('fault')});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
