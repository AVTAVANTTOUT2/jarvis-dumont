[build-system]
requires = ["uv_build==0.11.29"]
build-backend = "uv_build"

[project]
name = "jarvis-office"
version = "0.1.0"
description = "Offline diagnostics and isolated local Qwen3 TTS for Jarvis Office"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
chat = ["httpx==0.28.1"]

[project.scripts]
jarvis-office = "jarvis_office.cli:main"

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.16.6", "numpy==2.5.1", "soxr==1.1.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jarvis_office"]

[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_audio.*", "numpy", "soxr", "sounddevice", "onnxruntime", "faster_whisper", "ctranslate2"]
ignore_missing_imports = true
