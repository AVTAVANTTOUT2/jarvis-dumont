  "huggingface-hub==1.16.4", "idna==3.16", "jinja2==3.1.6",
  "markdown-it-py==4.2.0", "markupsafe==3.0.3", "mdurl==0.1.2",
  "miniaudio==1.71", "mlx==0.31.2", "mlx-lm==0.31.3", "mlx-metal==0.31.2",
  "numpy==2.4.6", "packaging==26.2", "protobuf==7.35.0", "pycparser==3.0",
  "pygments==2.20.0", "pyyaml==6.0.3", "regex==2026.5.9", "rich==15.0.0",
