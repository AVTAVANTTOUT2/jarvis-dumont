[project]
name = "jarvis-office-tts-runtime"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["jarvis-office", "mlx-audio==0.4.5"]

[tool.uv.sources]
jarvis-office = { path = "../..", editable = true }

