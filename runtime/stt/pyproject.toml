  "faster-whisper==1.2.1",
  "filelock==3.29.7",
  "flatbuffers==25.12.19",
  "fsspec==2026.6.0",
  "h11==0.16.0",
  "hf-xet==1.5.1",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "huggingface-hub==0.36.2",
  "idna==3.18",
  "numpy==2.5.1",
  "onnxruntime==1.27.0",
  "packaging==26.2",
