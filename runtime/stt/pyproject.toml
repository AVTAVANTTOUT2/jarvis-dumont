[project]
name = "jarvis-office-stt-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jarvis-office", "faster-whisper==1.2.1", "ctranslate2==4.8.1",
  "numpy==2.5.1", "onnxruntime==1.27.0", "sounddevice==0.5.5", "soxr==1.1.0",
  "av==18.0.0",
]

[tool.uv.sources]
jarvis-office = { path = "../..", editable = true }

[tool.uv]
# Installed V1 versions are read as metadata only; the environment is never copied.
